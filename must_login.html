<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUST Application Portal</title>
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        .logo-img {
            width: 80px;
            height: auto;
            margin-bottom: 15px;
        }

        .portal-title {
            color: #1e3a8a;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 28px;
            color: #111827;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #374151;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            color: #111827;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .name-row {
            display: flex;
            gap: 15px;
        }
        .name-row .form-group {
            flex: 1;
        }

        .utility-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4b5563;
            cursor: pointer;
        }

        .checkbox-label input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            background-color: #1e40af;
        }

        .footer-text {
            font-size: 14px;
            color: #4b5563;
        }

        /* CSS Form Switcher Logic */
        .form-toggle {
            display: none;
        }

        #register-form {
            display: none;
        }

        .form-toggle:checked ~ .card #login-form { display: none; }
        .form-toggle:checked ~ .card #register-form { display: block; }

        /* Password Eye Icon Styling */
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 38px;
            color: #9ca3af;
            cursor: pointer;
        }
        .toggle-password:hover {
            color: #4b5563;
        }
    </style>
</head>
<body>

    <!-- HIDDEN CHECKBOX (Controls which form is visible) -->
    <input type="checkbox" id="toggle-forms" class="form-toggle">

    <div class="card">
        <!-- Header Section -->
        <img src="must-logo.png" alt="MUST Logo" class="logo-img">
        <div class="portal-title">MUST Application Portal</div>

        <!-- ========================================== -->
        <!-- 1. LOGIN FORM                              -->
        <!-- ========================================== -->
        <div id="login-form">
            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to continue your application.</p>

            <div class="form-group">
                <label>Email address</label>
                <input type="email" class="form-control" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
                <!-- Eye Icon for Login -->
                <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword', this)"></i>
            </div>

            <div class="utility-row">
                <label class="checkbox-label">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <!-- Added onclick to simulate a login alert -->
            <button type="button" class="btn-primary" onclick="alert('Sign in successful! (Demo)')">Sign in</button>

            <p class="footer-text">
                New applicant? 
                <label for="toggle-forms" style="cursor: pointer; color: #2563eb; font-weight: 500;">
                    Create an account
                </label>
            </p>
        </div>

        <!-- ========================================== -->
        <!-- 2. REGISTRATION FORM                       -->
        <!-- ========================================== -->
        <div id="register-form">
            <h1>Create an account</h1>
            <p class="subtitle">Start your application. We will verify your email and mobile number.</p>

            <div class="name-row">
                <div class="form-group">
                    <label>First name</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Last name</label>
                    <input type="text" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email address</label>
                <input type="email" class="form-control" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label>Mobile number</label>
                <input type="tel" class="form-control" placeholder="+256 700 000 000" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" class="form-control" placeholder="At least 8 characters" minlength="8" required>
                <!-- Eye Icon for Registration -->
                <i class="fas fa-eye toggle-password" onclick="togglePassword('regPassword', this)"></i>
            </div>

            <div class="form-group" style="margin-top: 25px; margin-bottom: 25px;">
                <label class="checkbox-label" style="font-weight: normal; font-size: 13px; color: #4b5563;">
                    <input type="checkbox" required> 
                    I agree to the <a href="#">terms</a> and <a href="#">privacy notice</a>.
                </label>
            </div>

            <!-- JavaScript Alert for Create Account -->
            <button type="button" class="btn-primary" onclick="alert('Account created successfully! You can now sign in.')">Create account</button>

            <p class="footer-text">
                Already have an account? 
                <label for="toggle-forms" style="cursor: pointer; color: #2563eb; font-weight: 500;">
                    Sign in
                </label>
            </p>
        </div>
    </div>

    <script>
        // Function to toggle the password visibility
        function togglePassword(inputId, iconElement) {
            // Get the input field
            const input = document.getElementById(inputId);
            
            // Check current type and switch it
            if (input.type === "password") {
                input.type = "text";
                // Change eye icon to eye-slash
                iconElement.classList.remove("fa-eye");
                iconElement.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                // Change eye-slash back to eye
                iconElement.classList.remove("fa-eye-slash");
                iconElement.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
